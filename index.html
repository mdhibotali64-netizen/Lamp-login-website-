<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101109">
  <title>Lamp Login Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
    <div class="fireflies" id="fireflies" aria-hidden="true"></div>

    <section class="lamp-area" aria-label="Animated lamp">
      <div class="lamp-glow"></div>
      <div class="light-beam"></div>
      <div class="lamp">
        <div class="lamp-shade"></div>
        <div class="lamp-neck"></div>
        <div class="lamp-base"></div>
      </div>
      <button class="pull-switch" id="lampSwitch" aria-label="Toggle lamp">
        <span class="switch-cord"></span><span class="switch-pull"></span>
      </button>
      <p class="lamp-hint">TAP THE PULL TO TOGGLE LIGHT</p>
    </section>

    <section class="login-card" aria-labelledby="formTitle">
      <div class="card-topline"></div>
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1 id="formTitle">Welcome Back</h1>
      <p class="subtitle" id="formSubtitle">Enter your details to access your account</p>

      <div class="notice" id="notice" role="status" aria-live="polite"></div>
      <form id="authForm" novalidate>
        <label class="field">
          <span class="field-icon" aria-hidden="true">♙</span>
          <input id="name" name="name" type="text" placeholder="Full name" autocomplete="name" hidden>
        </label>
        <label class="field">
          <span class="field-icon" aria-hidden="true">♙</span>
          <input id="email" name="email" type="email" placeholder="Email Address" autocomplete="email" required>
        </label>
        <label class="field">
          <span class="field-icon" aria-hidden="true">▣</span>
          <input id="password" name="password" type="password" placeholder="Password (min. 8 characters)" autocomplete="current-password" minlength="8" required>
          <button class="show-password" id="togglePassword" type="button" aria-label="Show password">Show</button>
        </label>
        <button class="primary-button" id="submitButton" type="submit">Sign In <span aria-hidden="true">↗</span></button>
      </form>

      <div class="form-meta">
        <span id="switchPrompt">New here?</span>
        <button class="text-button" id="switchMode" type="button">Create an account</button>
      </div>
      <div class="separator"><span>OR CONTINUE WITH</span></div>
      <div class="social-row">
        <button class="social-button" id="googleButton" type="button"><span class="google-g">G</span> Google</button>
        <button class="social-button" id="githubButton" type="button"><span class="github-dot">●</span> GitHub</button>
      </div>
      <p class="fine-print">By continuing, you agree to our <a href="#" id="termsLink">Terms</a> and <a href="#" id="privacyLink">Privacy Policy</a>.</p>
    </section>

    <section class="welcome-panel" id="welcomePanel" hidden>
      <div class="welcome-icon">✓</div>
      <p class="eyebrow">YOU'RE SIGNED IN</p>
      <h2>Good to see you,<br><span id="welcomeName">friend</span>.</h2>
      <p class="welcome-copy">Your little corner of the internet is ready.</p>
      <button class="primary-button logout-button" id="logoutButton" type="button">Sign Out <span aria-hidden="true">↗</span></button>
    </section>
    <footer>MADE FOR QUIET NIGHTS <span>✦</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
